# ====================================
# Server Configuration
# ====================================
server.port=8080

# ====================================
# Database Configuration (PostgreSQL)
# ====================================
# These are overridden by environment-specific profiles
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================
# JPA & Hibernate Configuration
# ====================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ====================================
# JWT Configuration
# ====================================
# These are overridden by environment-specific profiles

# ====================================
# Application Info
# ====================================
spring.application.name=Hospital Management System
app.version=1.0.0

# ====================================
# Spring Profiles
# ====================================
# Use 'spring.profiles.active=dev' or 'spring.profiles.active=prod'
# Default to dev for local development
spring.profiles.default=dev