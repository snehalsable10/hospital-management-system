# ====================================
# Production Profile - Cloud Deployment
# ====================================
# CRITICAL: All secrets must come from environment variables
# Never hardcode production secrets in this file

# ====================================
# Server Configuration
# ====================================
server.port=${SERVER_PORT:8080}

# ====================================
# Database Configuration (PostgreSQL) - PROD
# ====================================
# REQUIRED Environment Variables:
#   DB_URL: jdbc:postgresql://prod-db-host:5432/hospital_management_prod
#   DB_USERNAME: production_db_user
#   DB_PASSWORD: [random strong password from secrets vault]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================
# JPA & Hibernate Configuration - PROD
# ====================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ====================================
# JWT Configuration - PROD
# ====================================
# REQUIRED Environment Variables:
#   JWT_SECRET: [256-bit random key from secrets vault]
#   JWT_EXPIRATION: 86400000 (24 hours in milliseconds)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ====================================
# Logging Configuration - PROD
# ====================================
# Production: MINIMAL logging
# CRITICAL: No sensitive data in logs (PHI, tokens, credentials)
# All logs shipped to centralized logging service (ELK, CloudWatch, etc.)

logging.level.root=WARN
logging.level.com.hms=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN

# Only errors and critical events
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=WARN

# JSON structured logging for ELK/CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File logging (for backup/audit)
# Overridable: a container may have no writable /var/log, and some platforms
# want logs on stdout only. Set LOG_FILE to a path, or to an empty value to
# disable file logging entirely.
logging.file.name=${LOG_FILE:/var/log/hms/application.log}
logging.file.max-size=50MB
logging.file.max-history=30

# Structured JSON logging configuration
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# ====================================
# CORS Configuration - PROD
# ====================================
# Frontend domain must be configured via environment variable
server.servlet.context-path=/

# ====================================
# Application Info - PROD
# ====================================
spring.application.name=Hospital Management System (PROD)
app.version=1.0.0
app.environment=production

# ====================================
# Security Configuration - PROD
# ====================================
# HTTPS is required in production, but not necessarily terminated here.
# Behind a platform load balancer (Render, Fly, an ingress controller) TLS
# ends at the edge and the app is handed plain HTTP on an internal network -
# enabling SSL here would then require a keystore the platform never provides,
# and the app would refuse to start.
#
# So this defaults to off, for the common case, and is switched on with
# SSL_ENABLED=true when this process really is the TLS endpoint.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# Trust the proxy's forwarded headers, so redirects and logged client IPs
# reflect the original request rather than the load balancer.
server.forward-headers-strategy=FRAMEWORK

# ====================================
# Redis Cache Configuration - PROD
# ====================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=30
spring.data.redis.lettuce.pool.max-idle=15
spring.data.redis.lettuce.pool.min-idle=10

# ====================================
# Spring Boot Actuator - Health & Metrics - PROD
# ====================================
# Production: Expose only essential endpoints (health + metrics)
management.endpoints.web.exposure.include=health,metrics,info
management.endpoints.web.base-path=/actuator
# Hide detailed health information from public (security)
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
# Enable metrics for monitoring
management.metrics.enable.all=true
management.metrics.export.simple.enabled=true
# Redis is a cache, not a hard dependency: the app serves from Postgres without it.
# The built-in indicator fails the whole health check when Redis is unreachable, which
# would make the platform restart a service that is still able to serve requests.
# HMSHealthIndicator still reports Redis status, as non-fatal.
management.health.redis.enabled=false

# ====================================
# Performance Monitoring - PROD
# ====================================
# Log a WARN for any request slower than this (milliseconds)
hms.performance.slow-request-threshold-ms=1000
# Hibernate logs any query slower than this (milliseconds)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500
# Slow queries log at INFO on this logger; org.hibernate is ERROR above, so set it explicitly
logging.level.org.hibernate.SQL_SLOW=INFO

# ====================================
# API Documentation - PROD
# ====================================
# Swagger is permitted in SecurityConfig for dev use; disable the endpoints outright
# in production so the API surface is not advertised publicly.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# ====================================
# Authentication Hardening
# ====================================
# An account is refused after this many consecutive failed sign-ins, for this
# long. The window slides: each failure pushes the expiry out, so guesses
# cannot be paced to stay under the limit.
hms.security.login.max-attempts=5
hms.security.login.lockout-minutes=15

# Per-IP cap on /api/auth/login and /api/auth/signup - the only endpoints
# reachable without a token. Counted in a fixed window.
hms.security.rate-limit.enabled=true
hms.security.rate-limit.requests=20
hms.security.rate-limit.window-seconds=60
