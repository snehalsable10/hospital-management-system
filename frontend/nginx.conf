server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied through the same origin as the app. That is why the
    # image is built with VITE_API_URL=/api: the browser only ever talks to
    # this server, so there is no cross-origin request and no CORS preflight.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a cold JVM to answer the first request.
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # Hashed filenames, so these can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: React Router owns the paths, so anything that is not a
    # real file falls back to index.html. Without this, reloading /patients
    # would 404 instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a browser keeps loading the
    # old one and asking for asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # This is a hospital admin app; there is no reason for it to be framed by
    # another site or to sniff content types.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
